<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр профиля</title>
    <style>
        html { box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }

        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-secondary: #636e72;
            --accent: #0984e3;
            --danger: #d63031;
            --edit: #00b894;
            --border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem;
        }

        h2 { margin: 0.5rem 0; font-size: 1.4rem; }

        .info { color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 1rem; }

        .books-section {
            text-align: left;
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .books-title { font-weight: 700; font-size: 0.9rem; color: var(--text-main); margin-bottom: 10px; display: block; }

        .book-item { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px; list-style: none; padding-left: 0; }

        .actions { display: flex; gap: 10px; justify-content: center; flex-direction: column; width: 100%; }

        .btn {
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-edit { background-color: var(--edit); color: white; }
        .btn-delete { background-color: var(--danger); color: white; }
        .btn-back { background-color: transparent; color: var(--text-secondary); margin-top: 15px; display: inline-block; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="card">
    <div class="profile-icon">👤</div>

    <h2 th:text="${person.getFio_person()}">Имя Фамилия</h2>

    <div class="info">
        <span>Год рождения: </span>
        <span th:text="${person.getYear_birth()}">1990</span>
    </div>

    <!-- Секция книг -->
    <div class="books-section">
        <span class="books-title">📚 Взятые книги:</span>

        <div th:if="${books.isEmpty()}">
            <p style="font-size: 0.85rem; color: #b2bec3;">Человек пока не взял ни одной книги</p>
        </div>

        <ul th:if="${!books.isEmpty()}" style="padding: 0; margin: 0;">
            <li class="book-item" th:each="book : ${books}">
                <span th:text="|«${book.getTitle()}», ${book.getAuthor()}, ${book.getYear()}|">Название, Автор, Год</span>
            </li>
        </ul>

    </div>

    <!-- Кнопки действий (всегда видны) -->
    <div class="actions">
        <a class="btn btn-edit" th:href="@{/people/{id}/edit(id=${person.getId_person()})}">
            Редактировать профиль
        </a>

        <form th:method="DELETE" th:action="@{/people/{id}(id=${person.getId_person()})}" style="width: 100%">
            <button type="submit" class="btn btn-delete">Удалить профиль</button>
        </form>
    </div>

    <a th:href="@{/people}" class="btn-back">← Вернуться к списку читателей</a>
    <a th:href="@{/books}" class="btn-back">← Посмотреть все доступные книги в Библиотеке</a>
</div>

</body>
</html>

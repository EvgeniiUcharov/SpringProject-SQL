<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список читателей</title>
    <style>
        /* Глобальный сброс для правильного расчета ширины */
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }

        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-secondary: #636e72;
            --accent: #0984e3;
            --accent-hover: #0773c5;
            --border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .person-card {
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .person-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }

        .person-info {
            display: flex;
            flex-direction: column;
        }

        .person-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .person-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .arrow {
            color: var(--border);
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .person-card:hover .arrow {
            color: var(--accent);
        }

        .btn-add {
            margin-top: 30px;
            background-color: var(--accent);
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3);
            transition: all 0.2s;
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(9, 132, 227, 0.4);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 50px;
        }
    </style>
</head>
<body>

<h1>👥 Список читателей</h1>

<div class="container">
    <!-- Цикл Thymeleaf по списку людей -->
    <div th:each="person : ${people}">
        <a class="person-card" th:href="@{/people/{id}(id=${person.getId()})}">
            <div class="person-info">
                <span class="person-name" th:text="${person.getFioPerson()}">Иван Иванов</span>
                <span class="person-meta" th:text="${person.getYearBirth() + ' г.р.'}">1990 г.р.</span>
            </div>
            <div class="arrow">→</div>
        </a>
    </div>

    <!-- Если список пуст -->
    <div th:if="${people.isEmpty()}" class="empty-state">
        <p>В базе пока никого нет...</p>
    </div>
</div>

<!-- Кнопка добавления -->
<a th:href="@{/people/new}" class="btn-add">+ Добавить человека</a>

</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <style>
        /* Глобальный сброс для правильного расчета ширины */
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }

        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-secondary: #636e72;
            --accent: #00b894; /* Зеленоватый оттенок для редактирования */
            --error: #d63031;
            --input-border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--accent);
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .error-message {
            color: var(--error);
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 500;
        }

        .btn-update {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-update:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .btn-back:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📝 Редактировать профиль</h2>

    <form th:method="PATCH" th:action="@{/people/{id}(id=*{id_person})}" th:object="${person}">

        <div class="form-group">
            <label for="name">ФИО:</label>
            <input type="text" th:field="*{fio_person}" id="name"/>
            <div class="error-message" th:if="${#fields.hasErrors('fio_person')}" th:errors="*{fio_person}">ФИО ошибка</div>
        </div>

        <div class="form-group">
            <label for="year_birth">Год рождения:</label>
            <input type="text" th:field="*{year_birth}" id="year_birth"/>
            <div class="error-message" th:if="${#fields.hasErrors('year_birth')}" th:errors="*{year_birth}">Год рождения ошибка</div>
        </div>

        <button type="submit" class="btn-update">Сохранить изменения</button>
    </form>

    <a th:href="@{/people/{id}(id=${person.id_person})}" class="btn-back">← Отмена</a>
</div>

</body>
</html>
